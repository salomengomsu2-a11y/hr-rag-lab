# Demo: ask GitHub for an OIDC token and read what it says. No AWS needed.
name: OIDC token demo
on:
  push:
    branches: ['demo/**']
permissions:
  id-token: write        # allow this job to ask GitHub for an OIDC token
  contents: read
jobs:
  show-token:
    runs-on: ubuntu-24.04
    steps:
      - name: Ask GitHub for a token made for AWS STS, and print its claims
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          # Only the claims are printed, never the token itself.
          for key in ["iss", "aud", "sub", "repository", "repository_id", "repository_owner_id", "ref", "workflow", "actor"]:
              print(f"{key:20} {claims.get(key)}")
          print(f"{'valid for':20} {(claims['exp'] - claims['iat']) // 60} minutes")
          PY
